<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ Free Voice Synthesis Studio - Piper TTS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0015;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 0, 170, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 255, 0.1) 0%, transparent 50%);
            font-family: 'Courier New', monospace;
            padding: 2rem;
            color: #00ffff;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff1493, 0 0 40px #ff1493;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 1rem;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            letter-spacing: 1px;
        }

        .card {
            background: rgba(10, 0, 21, 0.8);
            border: 2px solid #00ffff;
            border-radius: 4px;
            padding: 2rem;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(255, 0, 170, 0.1);
            backdrop-filter: blur(10px);
        }

        .section {
            margin-bottom: 2rem;
        }

        .label {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 1rem;
            font-size: 1rem;
            border: 2px solid #00ffff;
            border-radius: 0px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            outline: none;
            transition: all 0.3s;
            background: rgba(0, 20, 40, 0.6);
            color: #00ff00;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2);
        }

        textarea:focus {
            border-color: #ff00ff;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2), 0 0 20px rgba(255, 0, 170, 0.3);
        }

        .char-count {
            font-size: 0.85rem;
            color: #00ffff;
            margin-top: 0.5rem;
            text-shadow: 0 0 5px #00ffff;
        }

        .voice-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .voice-card {
            background: rgba(20, 0, 40, 0.6);
            border: 2px solid #00ffff;
            border-radius: 0px;
            padding: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.1);
        }

        .voice-card:hover {
            border-color: #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 170, 0.4), inset 0 0 10px rgba(255, 0, 170, 0.1);
            transform: translateY(-2px);
        }

        .voice-card.selected {
            background: rgba(255, 0, 170, 0.1);
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 170, 0.5), inset 0 0 15px rgba(255, 0, 170, 0.2);
        }

        .voice-name {
            font-weight: 700;
            color: #00ffff;
            margin-bottom: 0.5rem;
            font-size: 1rem;
            text-shadow: 0 0 5px #00ffff;
        }

        .voice-badge {
            display: inline-block;
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 0.25rem 0.75rem;
            border-radius: 0px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            text-shadow: 0 0 5px #00ffff;
            text-transform: uppercase;
        }

        .voice-badge.natural {
            background: rgba(255, 0, 170, 0.2);
            border-color: #ff00ff;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }

        .voice-info {
            font-size: 0.85rem;
            color: #00ff00;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .voice-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .voice-btn {
            flex: 1;
            padding: 0.6rem;
            font-size: 0.85rem;
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
            border: 1px solid #00ffff;
            border-radius: 0px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            text-shadow: 0 0 5px #00ffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .voice-btn:hover:not(:disabled) {
            background: rgba(255, 0, 170, 0.3);
            border-color: #ff00ff;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            box-shadow: 0 0 10px rgba(255, 0, 170, 0.5);
        }

        .voice-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .control {
            display: flex;
            flex-direction: column;
        }

        .control label {
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            border-radius: 4px;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #ff00ff;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff00ff;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #ff00ff;
            cursor: pointer;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 10px #ff00ff;
        }

        .value {
            font-size: 0.9rem;
            color: #00ffff;
            font-weight: 600;
            margin-top: 0.5rem;
            text-shadow: 0 0 5px #00ffff;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border: 2px solid #00ffff;
            border-radius: 0px;
            cursor: pointer;
            transition: all 0.3s;
            color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
            text-shadow: 0 0 5px #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }

        .btn-play {
            border-color: #00ff00;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
            background: rgba(0, 255, 0, 0.1);
            grid-column: span 2;
        }

        .btn-play:hover:not(:disabled) {
            background: rgba(0, 255, 0, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
            transform: scale(1.05);
        }

        .btn-pause {
            border-color: #ff00ff;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            background: rgba(255, 0, 170, 0.1);
        }

        .btn-pause:hover:not(:disabled) {
            background: rgba(255, 0, 170, 0.3);
            box-shadow: 0 0 20px rgba(255, 0, 170, 0.6);
            transform: scale(1.05);
        }

        .btn-stop {
            border-color: #ff0080;
            color: #ff0080;
            text-shadow: 0 0 5px #ff0080;
            background: rgba(255, 0, 128, 0.1);
        }

        .btn-stop:hover:not(:disabled) {
            background: rgba(255, 0, 128, 0.3);
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.6);
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .status {
            padding: 1rem;
            border-radius: 0px;
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
            transition: all 0.3s;
            border: 2px solid #00ffff;
            text-shadow: 0 0 10px #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status.playing {
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
            border-color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .status.paused {
            background: rgba(255, 255, 0, 0.1);
            color: #ffff00;
            border-color: #ffff00;
            text-shadow: 0 0 10px #ffff00;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.3);
        }

        .status.error {
            background: rgba(255, 0, 128, 0.1);
            color: #ff0080;
            border-color: #ff0080;
            text-shadow: 0 0 10px #ff0080;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.3);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 0px;
            margin-bottom: 1rem;
            overflow: hidden;
            border: 1px solid #00ffff;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            width: 0%;
            transition: width 0.1s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(255, 0, 170, 0.6);
        }

        .engine-note {
            background: rgba(255, 0, 170, 0.1);
            padding: 1rem;
            border-radius: 0px;
            border-left: 4px solid #ff00ff;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ Free Voice Synthesis Studio</h1>
            <p>Natural voices with Piper TTS - completely free</p>
        </div>

        <div class="card">
            <div class="engine-note">
                <strong>🎯 Real Natural Voices:</strong> Powered by free TTS API. Sound WAY better than browser voices. No signup needed - completely free!
            </div>

            <!-- Text Input Section -->
            <div class="section">
                <label class="label">📝 Text to Read</label>
                <textarea id="textInput" placeholder="Paste your book chapter, article, or any long-form text here...">Lilith smiled for the first time that day. Found you. Below them both, deep inside the planet, a current that had been silent for generations flickered awake.</textarea>
                <div class="char-count">Characters: <span id="charCount">160</span></div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <!-- Status Display -->
            <div class="status" id="statusDisplay">Ready to speak</div>

            <!-- Voice Selection -->
            <div class="section">
                <label class="label">🎤 Select a Voice</label>
                <div class="voice-container" id="voiceContainer"></div>
            </div>

            <!-- Controls -->
            <div class="section">
                <label class="label">⚙️ Settings</label>
                <div class="controls-grid">
                    <div class="control">
                        <label>Speed</label>
                        <input type="range" id="speedSlider" min="0.5" max="2" value="1" step="0.1">
                        <div class="value"><span id="speedValue">1.0</span>x</div>
                    </div>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="section">
                <div class="button-group">
                    <button class="btn-play" id="playBtn">▶️ Play</button>
                    <button class="btn-pause" id="pauseBtn" disabled>⏸️ Pause</button>
                    <button class="btn-stop" id="stopBtn" disabled>⏹️ Stop</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Free TTS voices from ttsmp3.com API
        const VOICES = [
            { name: "Brian (Male, Clear)", speaker: "Brian", gender: "Male" },
            { name: "Amy (Female, Natural)", speaker: "Amy", gender: "Female" },
            { name: "Emma (Female, Warm)", speaker: "Emma", gender: "Female" },
            { name: "Joey (Male, Friendly)", speaker: "Joey", gender: "Male" },
            { name: "Ivy (Female, Bright)", speaker: "Ivy", gender: "Female" },
            { name: "Justin (Male, Casual)", speaker: "Justin", gender: "Male" },
        ];

        // DOM Elements
        const textInput = document.getElementById('textInput');
        const charCount = document.getElementById('charCount');
        const voiceContainer = document.getElementById('voiceContainer');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDisplay = document.getElementById('statusDisplay');
        const progressFill = document.getElementById('progressFill');

        let selectedVoice = VOICES[0];
        let currentAudio = null;
        let isPaused = false;
        let isLoading = false;

        // Initialize voice cards
        function initializeVoices() {
            voiceContainer.innerHTML = '';
            VOICES.forEach((voice, index) => {
                const card = document.createElement('div');
                card.className = 'voice-card' + (index === 0 ? ' selected' : '');
                
                card.innerHTML = `
                    <div class="voice-name">${voice.name}</div>
                    <span class="voice-badge natural">⭐ Free TTS</span>
                    <div class="voice-info">
                        <div>Gender: ${voice.gender}</div>
                        <div>Natural Sounding</div>
                    </div>
                    <div class="voice-buttons">
                        <button class="voice-btn test-btn" onclick="testVoice('${voice.speaker}')">
                            Test
                        </button>
                        <button class="voice-btn select-btn" onclick="selectVoice('${voice.speaker}', '${voice.name}', this.closest('.voice-card'))">
                            Select
                        </button>
                    </div>
                `;
                voiceContainer.appendChild(card);
            });
        }

        // Select voice
        window.selectVoice = function(speaker, name, cardElement) {
            document.querySelectorAll('.voice-card').forEach(card => card.classList.remove('selected'));
            cardElement.classList.add('selected');
            selectedVoice = { speaker: speaker, name: name };
            statusDisplay.textContent = `✓ Selected: ${name}`;
        };

        // Test voice
        window.testVoice = function(voiceId) {
            if (isLoading) return;
            const testText = "Testing this voice. It should sound much better than robotic voices.";
            speakText(testText, voiceId);
        };

        // Speak text using free ttsmp3 API (no auth, no keys needed)
        function speakText(text, voiceId) {
            if (!text.trim()) {
                statusDisplay.className = 'status error';
                statusDisplay.textContent = '❌ Please enter text to synthesize';
                return;
            }

            if (isLoading) {
                statusDisplay.textContent = '⏳ Already processing...';
                return;
            }

            isLoading = true;
            playBtn.disabled = true;
            statusDisplay.className = 'status playing';
            statusDisplay.textContent = '⏳ Generating speech...';

            // Stop any current audio
            if (currentAudio && currentAudio.audio) {
                currentAudio.audio.pause();
            }

            const speed = parseFloat(speedSlider.value);
            const text_to_speak = text.trim();
            const voice = voiceId || selectedVoice.speaker;

            // Create audio element
            const audio = new Audio();
            audio.playbackRate = speed;

            // Use ttsmp3.com free API
            const encodedText = encodeURIComponent(text_to_speak);
            const ttsUrl = `https://ttsmp3.com/api/TTS?text=${encodedText}&lang=en&voice=${voice}`;

            audio.onplay = () => {
                statusDisplay.className = 'status playing';
                statusDisplay.textContent = '▶️ Playing...';
                pauseBtn.disabled = false;
                stopBtn.disabled = false;
            };

            audio.onended = () => {
                playBtn.disabled = false;
                pauseBtn.disabled = true;
                stopBtn.disabled = true;
                statusDisplay.className = 'status';
                statusDisplay.textContent = '✅ Finished reading';
                progressFill.style.width = '100%';
                isLoading = false;
            };

            audio.onerror = (e) => {
                statusDisplay.className = 'status error';
                statusDisplay.textContent = '❌ Audio error. Try shorter text or check internet.';
                playBtn.disabled = false;
                isLoading = false;
            };

            audio.ontimeupdate = () => {
                if (audio.duration) {
                    progressFill.style.width = (audio.currentTime / audio.duration) * 100 + '%';
                }
            };

            audio.onpause = () => {
                if (!audio.ended) {
                    statusDisplay.className = 'status paused';
                    statusDisplay.textContent = '⏸️ Paused';
                }
            };

            currentAudio = { audio: audio };
            audio.src = ttsUrl;
            
            audio.play().catch(e => {
                statusDisplay.className = 'status error';
                statusDisplay.textContent = '❌ Error: ' + e.message;
                playBtn.disabled = false;
                isLoading = false;
            });
        }

        // Update speed display
        speedSlider.addEventListener('input', (e) => {
            speedValue.textContent = parseFloat(e.target.value).toFixed(1);
        });

        // Character count
        textInput.addEventListener('input', (e) => {
            charCount.textContent = e.target.value.length;
        });

        // Play button
        playBtn.addEventListener('click', () => {
            speakText(textInput.value);
        });

        // Pause button
        pauseBtn.addEventListener('click', () => {
            if (currentAudio && currentAudio.context) {
                if (isPaused) {
                    currentAudio.context.resume();
                    statusDisplay.className = 'status playing';
                    statusDisplay.textContent = '▶️ Resumed...';
                    isPaused = false;
                } else {
                    currentAudio.context.suspend();
                    statusDisplay.className = 'status paused';
                    statusDisplay.textContent = '⏸️ Paused';
                    isPaused = true;
                }
            }
        });

        // Stop button
        stopBtn.addEventListener('click', () => {
            if (currentAudio && currentAudio.source) {
                try {
                    currentAudio.source.stop();
                } catch (e) {
                    // Already stopped
                }
            }
            playBtn.disabled = false;
            pauseBtn.disabled = true;
            stopBtn.disabled = true;
            statusDisplay.className = 'status';
            statusDisplay.textContent = '⏹️ Stopped';
            isPaused = false;
            progressFill.style.width = '0%';
            isLoading = false;
        });

        // Initialize
        initializeVoices();
        charCount.textContent = textInput.value.length;
    </script>
</body>
</html>
