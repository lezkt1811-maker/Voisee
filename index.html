<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ Free Voice Synthesis Studio</title>
    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0015;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 0, 170, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 255, 0.1) 0%, transparent 50%);
            font-family: 'Courier New', monospace;
            padding: 1rem;
            color: #00ffff;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 1rem;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.2rem;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 0.9rem;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .card {
            background: rgba(10, 0, 21, 0.9);
            border: 2px solid #00ffff;
            padding: 1.5rem;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(255, 0, 170, 0.1);
        }

        .section {
            margin-bottom: 1.5rem;
        }

        .label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 1rem;
            font-size: 1rem;
            border: 2px solid #00ffff;
            font-family: 'Courier New', monospace;
            resize: vertical;
            background: rgba(0, 20, 40, 0.6);
            color: #00ff00;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2);
            outline: none;
        }

        textarea:focus {
            border-color: #ff00ff;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2), 0 0 20px rgba(255, 0, 170, 0.3);
        }

        .char-count {
            font-size: 0.8rem;
            color: #00ffff;
            margin-top: 0.3rem;
            text-shadow: 0 0 5px #00ffff;
        }

        .voice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .voice-btn {
            padding: 0.7rem;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #00ffff;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 5px #00ffff;
        }

        .voice-btn:hover {
            background: rgba(255, 0, 170, 0.3);
            border-color: #ff00ff;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            box-shadow: 0 0 10px rgba(255, 0, 170, 0.5);
        }

        .voice-btn.active {
            background: rgba(255, 0, 170, 0.2);
            border-color: #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 170, 0.6);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .control {
            display: flex;
            flex-direction: column;
        }

        .control label {
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #ff00ff;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff00ff;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #ff00ff;
            cursor: pointer;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 10px #ff00ff;
        }

        .value {
            font-size: 0.8rem;
            color: #00ffff;
            margin-top: 0.2rem;
            text-shadow: 0 0 5px #00ffff;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        button {
            padding: 0.8rem;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid #00ffff;
            cursor: pointer;
            transition: all 0.3s;
            color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
            text-shadow: 0 0 5px #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }

        .btn-play {
            border-color: #00ff00;
            color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
            grid-column: span 2;
        }

        .btn-play:hover:not(:disabled) {
            background: rgba(0, 255, 0, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }

        .btn-stop {
            border-color: #ff0080;
            color: #ff0080;
            background: rgba(255, 0, 128, 0.1);
            grid-column: span 2;
        }

        .btn-stop:hover:not(:disabled) {
            background: rgba(255, 0, 128, 0.3);
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.6);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .status {
            padding: 1rem;
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            font-weight: 600;
            text-align: center;
            border: 2px solid #00ffff;
            text-shadow: 0 0 10px #00ffff;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
        }

        .status.playing {
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
            border-color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .status.error {
            background: rgba(255, 0, 128, 0.1);
            color: #ff0080;
            border-color: #ff0080;
            text-shadow: 0 0 10px #ff0080;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.3);
        }

        .progress {
            width: 100%;
            height: 8px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            width: 0%;
            transition: width 0.1s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ FREE VOICE</h1>
            <p>Natural TTS Reading - American Voices</p>
        </div>

        <div class="card">
            <div class="section">
                <label class="label">📝 Text</label>
                <textarea id="textInput" placeholder="Paste your book chapter, article, or any text here...">Lilith smiled for the first time that day. Found you. Below them both, deep inside the planet, a current that had been silent for generations flickered awake. The ground trembled beneath their feet as ancient machinery groaned back to life. Somewhere in the darkness, something was waking up. Something that had been sleeping for ten thousand years. And it was hungry.</textarea>
                <div class="char-count">Characters: <span id="charCount">0</span></div>
            </div>

            <div class="progress">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="status" id="statusDisplay">Ready</div>

            <div class="section">
                <label class="label">🎤 Voice (American)</label>
                <div class="voice-grid">
                    <button class="voice-btn active" data-voice="US English Female">Female - Natural</button>
                    <button class="voice-btn" data-voice="US English Male">Male - Deep</button>
                    <button class="voice-btn" data-voice="Google US English Female">Google Female</button>
                    <button class="voice-btn" data-voice="Google US English Male">Google Male</button>
                    <button class="voice-btn" data-voice="Zira">Female - Zira</button>
                    <button class="voice-btn" data-voice="David">Male - David</button>
                </div>
            </div>

            <div class="section">
                <label class="label">⚙️ Settings</label>
                <div class="controls">
                    <div class="control">
                        <label>Speed</label>
                        <input type="range" id="speedSlider" min="0.5" max="2" value="1" step="0.1">
                        <div class="value"><span id="speedValue">1.0</span>x</div>
                    </div>
                    <div class="control">
                        <label>Pitch</label>
                        <input type="range" id="pitchSlider" min="0.5" max="2" value="1" step="0.1">
                        <div class="value"><span id="pitchValue">1.0</span>x</div>
                    </div>
                </div>
            </div>

            <div class="buttons">
                <button class="btn-play" id="playBtn">▶️ Play</button>
                <button class="btn-stop" id="stopBtn" disabled>⏹️ Stop</button>
            </div>
        </div>
    </div>

    <script>
        let selectedVoice = 'US English Female';
        let isPlaying = false;

        const textInput = document.getElementById('textInput');
        const charCount = document.getElementById('charCount');
        const statusDisplay = document.getElementById('statusDisplay');
        const progressFill = document.getElementById('progressFill');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const pitchSlider = document.getElementById('pitchSlider');
        const pitchValue = document.getElementById('pitchValue');

        // Wait for ResponsiveVoice to load
        if (typeof responsiveVoice !== 'undefined') {
            responsiveVoice.OnFinishedCallback = function() {
                if (!isPlaying) return;
            };
        }

        // Voice selection
        document.querySelectorAll('.voice-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedVoice = btn.dataset.voice;
                statusDisplay.textContent = '✓ Voice: ' + btn.textContent.trim();
                statusDisplay.className = 'status';
            });
        });

        // Sliders
        speedSlider.addEventListener('input', (e) => {
            speedValue.textContent = parseFloat(e.target.value).toFixed(1);
        });

        pitchSlider.addEventListener('input', (e) => {
            pitchValue.textContent = parseFloat(e.target.value).toFixed(1);
        });

        // Character count
        textInput.addEventListener('input', (e) => {
            charCount.textContent = e.target.value.length;
        });

        // Stop button
        stopBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (typeof responsiveVoice !== 'undefined') {
                responsiveVoice.cancel();
            }
            isPlaying = false;
            playBtn.disabled = false;
            stopBtn.disabled = true;
            statusDisplay.textContent = '⏹️ Stopped';
            statusDisplay.className = 'status';
            progressFill.style.width = '0%';
        });

        // Play button
        playBtn.addEventListener('click', (e) => {
            e.preventDefault();
            
            const text = textInput.value.trim();
            if (!text) {
                statusDisplay.textContent = '❌ Please enter text';
                statusDisplay.className = 'status error';
                return;
            }

            if (isPlaying) return;

            if (typeof responsiveVoice === 'undefined') {
                statusDisplay.textContent = '⏳ Loading voices...';
                statusDisplay.className = 'status playing';
                setTimeout(() => playBtn.click(), 2000);
                return;
            }

            isPlaying = true;
            playBtn.disabled = true;
            stopBtn.disabled = false;
            statusDisplay.textContent = '▶️ Reading...';
            statusDisplay.className = 'status playing';
            progressFill.style.width = '10%';

            const rate = parseFloat(speedSlider.value);
            const pitch = parseFloat(pitchSlider.value);

            try {
                responsiveVoice.speak(text, selectedVoice, {
                    rate: rate,
                    pitch: pitch,
                    volume: 1,
                    onstart: () => {
                        statusDisplay.textContent = '▶️ Now reading...';
                        statusDisplay.className = 'status playing';
                        progressFill.style.width = '15%';
                    },
                    onend: () => {
                        statusDisplay.textContent = '✅ Finished';
                        statusDisplay.className = 'status';
                        playBtn.disabled = false;
                        stopBtn.disabled = true;
                        isPlaying = false;
                        progressFill.style.width = '100%';
                    },
                    onerror: () => {
                        statusDisplay.textContent = '❌ Playback error';
                        statusDisplay.className = 'status error';
                        playBtn.disabled = false;
                        stopBtn.disabled = true;
                        isPlaying = false;
                    }
                });
            } catch (error) {
                statusDisplay.textContent = '❌ Error: ' + error.message;
                statusDisplay.className = 'status error';
                playBtn.disabled = false;
                isPlaying = false;
            }
        });

        // Initialize
        charCount.textContent = textInput.value.length;
    </script>
</body>
</html>
